
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مغامرة عيونك</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Tahoma;background:linear-gradient(135deg,#d9f4ff,#fff0d7);color:#24446a;text-align:center}
main{max-width:850px;min-height:100dvh;margin:auto;padding:18px;display:flex;flex-direction:column;justify-content:center}
section{background:white;border-radius:28px;padding:22px;box-shadow:0 10px 30px #35557722}
h1{font-size:36px;color:#2464ad}
button{font:inherit;font-weight:bold;cursor:pointer;border:0;border-radius:18px;padding:15px;background:#4285e8;color:white;touch-action:manipulation}
button:active{transform:scale(.96)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}
.hero,.card,.answer{background:#eaf5ff;color:#24446a;border:3px solid #d5e8ff}
.hero{min-height:115px}
.hero span{display:block;font-size:40px}
.selected{border-color:#ffae37;background:#fff2cb}
.hidden{display:none!important}
#hud{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:12px}
#arena{height:260px;position:relative;overflow:hidden;background:linear-gradient(#b8e8ff,#e6faff);border-radius:20px;margin:15px 0;touch-action:manipulation}
.item{position:absolute;font-size:43px;cursor:pointer;user-select:none}
#clock{font-size:28px;font-weight:bold}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}
.card{font-size:32px;min-height:80px;padding:8px}
.matched{background:#d5f5dc;border-color:#61c37c}
.answers{display:grid;gap:12px;margin:20px 0}
.answer{font-size:18px}
#feedback{font-size:19px;font-weight:bold;min-height:45px;margin:12px}
#next{margin-top:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
  
.hero img{
  display:block;
  width:100%;
  height:150px;
  object-fit:contain;
  margin-bottom:8px;
}
.character-img{
  display:block;
  width:140px;
  height:180px;
  object-fit:contain;
  margin:10px auto;
}
</style>
</head>
<body>
<main>
<div id="hud" class="hidden">
<span id="level"></span>
<span id="points"></span>
</div>

<section id="home">
<h1>👀 مغامرة عيونك</h1>
<p>أهلًا بك في عالم أبطال العيون!</p>
<h2>اختر بطلك المفضل</h2>
<div id="heroes" class="grid"></div>
<button onclick="start()">ابدأ المغامرة 🚀</button>
<p>ثلاث ألعاب ممتعة تنتظرك!</p>
</section>

<section id="game" class="hidden">
<h2 id="title"></h2>
<p id="instructions"></p>
<div id="content"></div>
<div id="feedback" aria-live="polite"></div>
<button id="next" class="hidden" onclick="advance()">المرحلة التالية</button>
</section>

<section id="finish" class="hidden">
<h1>🎉 مبروك يا بطل!</h1>
<div style="font-size:70px">🏆</div>
<h2 id="result"></h2>
<p>أنت الآن من أبطال حماية العيون!</p>
<button onclick="restart()">العب مرة ثانية 🔄</button>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const names=["نور","لين","أنس","نجم"];
const dreams=["طبيبة","عالمة","لاعب كرة","طيار"];
const faces=
const faces=[
  "Noor.PNG",
  "Leen.PNG",
  "Anas.PNG",
  "Najm .PNG"
];

let hero=0,stage=0,score=0;
let timer=null,spawn=null,locked=false;
let opened=[],matches=0,question=0;
const questions=[
{q:"إذا دخل شيء في عينك، وش تسوي؟",a:["أفرك عيني بقوة","ما افرك عيني وأغسلها بالماء   "],correct:1},
{q:"وش الأفضل وقت القراءة؟",a:["إضاءة مناسبة","غرفة مظلمة"],correct:0},
{q:"بعد استخدام الشاشة مدة طويلة؟",a:["آخذ استراحة وأنظر بعيدًا","أستمر بدون راحة"],correct:0}
];

names.forEach((name,i)=>{
let b=document.createElement("button");
b.className="hero"+(i===0?" selected":"");
b.innerHTML="<span>"+faces[i]+"</span>"+name+"<br><small>"+dreams[i]+" المستقبل</small>";
b.onclick=()=>{
hero=i;
document.querySelectorAll(".hero").forEach(x=>x.classList.remove("selected"));
b.classList.add("selected");
};
$("heroes").appendChild(b);
});

function show(id){
["home","game","finish"].forEach(x=>$(x).classList.toggle("hidden",x!==id));
$("hud").classList.toggle("hidden",id!=="game");
}
function update(){
$("level").textContent="المرحلة "+(stage+1)+" من 3";
$("points").textContent="⭐ "+score;
}
function stopTimers(){clearInterval(timer);clearInterval(spawn)}
function start(){
stage=0;score=0;show("game");load();
}
function load(){
stopTimers();locked=false;
$("feedback").textContent="";
$("next").classList.add("hidden");
$("content").innerHTML="";
update();
if(stage===0)catchGame();
if(stage===1)memoryGame();
if(stage===2)rescueGame();
}
function complete(message){
stopTimers();
$("feedback").textContent=message;
$("next").textContent=stage===2?"شاهد النتيجة 🏆":"المرحلة التالية ➜";
$("next").classList.remove("hidden");
}
function advance(){
stage++;
if(stage===3){
show("finish");
$("result").textContent=names[hero]+" جمعت "+score+" نجمة!";
}else load();
}
function restart(){stopTimers();show("home")}

function catchGame(){
$("title").textContent="🍎 صائد العادات الصحية";
$("instructions").textContent="اضغط على الأشياء المفيدة للعين وتجنب العادات الضارة!";
$("content").innerHTML='<div id="clock">⏱️ 20</div><div id="arena"></div>';
let seconds=20;
const good=["🥕","🥦","🕶️","☀️"];
const bad=["📱","🎮"];
function add(){
let arena=$("arena");
let healthy=Math.random()<.7;
let options=healthy?good:bad;
let item=document.createElement("span");
item.className="item";
item.textContent=options[Math.floor(Math.random()*options.length)];
item.style.left=(5+Math.random()*80)+"%";
item.style.top="-45px";
arena.appendChild(item);
let y=-45;
let motion=setInterval(()=>{
if(!item.isConnected){clearInterval(motion);return}
y+=3;item.style.top=y+"px";
if(y>260){item.remove();clearInterval(motion)}
},30);
item.onclick=()=>{
if(!item.isConnected)return;
score=Math.max(0,score+(healthy?2:-1));
update();
$("feedback").textContent=healthy?"⭐ ممتاز!":"💡 انتبه للاختيار!";
item.remove();clearInterval(motion);
};
}
spawn=setInterval(add,650);
timer=setInterval(()=>{
seconds--;
$("clock").textContent="⏱️ "+seconds;
if(seconds<=0)complete("🎉 انتهى التحدي!");
},1000);
}

function memoryGame(){
$("title").textContent="🧠 ذاكرة عين الصقر";
$("instructions").textContent="اقلب البطاقات وابحث عن الصور المتطابقة!";
let symbols=["👓","🕶️","🥕","👀"];
let deck=[...symbols,...symbols].sort(()=>Math.random()-.5);
opened=[];matches=0;locked=false;
let board=document.createElement("div");
board.className="cards";
deck.forEach((symbol,i)=>{
let b=document.createElement("button");
b.className="card";b.textContent="❓";
b.onclick=()=>{
if(locked||opened.includes(i)||b.classList.contains("matched"))return;
b.textContent=symbol;opened.push(i);
if(opened.length===2){
let [a,c]=opened;
if(deck[a]===deck[c]){
board.children[a].classList.add("matched");
board.children[c].classList.add("matched");
opened=[];matches++;score+=3;update();
if(matches===4)complete("🎉 ذاكرتك قوية!");
}else{
locked=true;
setTimeout(()=>{
if(!board.isConnected)return;
board.children[a].textContent="❓";
board.children[c].textContent="❓";
opened=[];locked=false;
},850);
}
}
};
board.appendChild(b);
});
$("content").appendChild(board);
}

function rescueGame(){
$("title").textContent="🦸 أنقذ البطل!";
$("instructions").textContent="ساعد بطلك يختار التصرف الصحيح!";
question=0;ask();
}
function ask(){
let q=questions[question];
$("feedback").textContent="";
$("content").innerHTML="<h2>"+faces[hero]+"</h2><h3>"+q.q+"</h3>";
let box=document.createElement("div");
box.className="answers";
q.a.forEach((answer,i)=>{
let b=document.createElement("button");
b.className="answer";b.textContent=answer;
b.onclick=()=>{
if(locked)return;
locked=true;
if(i===q.correct){
score+=5;
$("feedback").textContent="⭐ إجابة صحيحة!";
}else{
$("feedback").textContent="💡 الإجابة الصحيحة: "+q.a[q.correct];
}
update();
setTimeout(()=>{
question++;locked=false;
if(question<questions.length)ask();
else complete("🏆 أنقذت البطل!");
},1700);
};
box.appendChild(b);
});
$("content").appendChild(box);
}
</script>
</body>
</html>
